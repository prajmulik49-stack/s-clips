# Daily Shorts: plan once (shared, so no scene repeats across channels) -> each channel renders + uploads in parallel.
# Channels come from config.yaml daily.channels. Secrets per channel: <env>_CLIENT_ID, <env>_CLIENT_SECRET,
# <env>_REFRESH_TOKEN (e.g. YT_A_...), YOUTUBE_API_KEY. Optional secret YTDLP_COOKIES. Optional variable RUNNER = "self-hosted"
# (private repos only!). Long-term: see docs/DAILY_SETUP.md "Running for years".
name: daily-shorts

on:
  schedule:
    - cron: "30 20 * * *"          # 02:00 IST every day (GitHub may start it a few minutes late)
    - cron: "30 23 * * *"          # 05:00 IST catch-up: reuses today's plan, posts only what 02:00 didn't (no-op if all done)
    - cron: "0 22 * * *"           # 03:30 IST: channel_b's repo (sees channel_a's plan of the day)
    - cron: "0 0 * * *"            # 05:30 IST: channel_b catch-up
    # each repo runs only the crons its channel lists in config.yaml daily.channels (others exit in seconds)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the plan (no render, no upload)"
        type: boolean
        default: false

concurrency:
  group: daily-shorts
  cancel-in-progress: false

permissions:
  contents: write                   # commit state/ (what was posted) back to the repo

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # record = play each vlog in Chrome and record it (no yt-dlp download; GitHub IPs get bot-checked).
  # Override with repo variable JOSHICLIP_FETCH = auto (yt-dlp first, record if it fails) or ytdlp.
  JOSHICLIP_FETCH: ${{ vars.JOSHICLIP_FETCH || 'record' }}

jobs:
  plan:
    runs-on: ${{ vars.RUNNER || 'windows-latest' }}
    timeout-minutes: 120                # a new vlog is recorded in real time (+ up to 40 min waiting for the other channel's plan)
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # listings + comments via the API (fewer yt-dlp bot checks)
      JOSHICLIP_YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}  # optional: download via a non-datacenter IP
    outputs:
      date: ${{ steps.plan.outputs.date }}
      channels: ${{ steps.plan.outputs.channels }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: ${{ !vars.RUNNER }}           # self-hosted: keep work/ (the analysis cache) between runs
      - uses: ./.github/actions/setup
        with:
          cookies: ${{ secrets.YTDLP_COOKIES }}
      - name: YouTube login check (fails in seconds instead of after 30 min of planning)
        shell: pwsh
        env:
          YT_A_CLIENT_ID: ${{ secrets.YT_A_CLIENT_ID }}
          YT_A_CLIENT_SECRET: ${{ secrets.YT_A_CLIENT_SECRET }}
          YT_A_REFRESH_TOKEN: ${{ secrets.YT_A_REFRESH_TOKEN || secrets.YT_REFRESH_TOKEN }}
          YT_B_CLIENT_ID: ${{ secrets.YT_B_CLIENT_ID }}
          YT_B_CLIENT_SECRET: ${{ secrets.YT_B_CLIENT_SECRET }}
          YT_B_REFRESH_TOKEN: ${{ secrets.YT_B_REFRESH_TOKEN }}
        run: |
          $env:JOSHICLIP_SCHEDULE = "${{ github.event.schedule }}"
          $chs = python -c "from joshiclip import config, daily; print(' '.join(daily.my_channels(config.load()['daily'])))"
          foreach ($c in $chs.Split(' ', [StringSplitOptions]::RemoveEmptyEntries)) {
            python -m joshiclip check-auth --channel $c
            if ($LASTEXITCODE -ne 0) { Write-Error "YouTube login for $c is broken: check this repo's YT_* secrets"; exit 1 }
          }
      - name: Restore analysis cache
        if: ${{ !vars.RUNNER }}
        uses: actions/cache/restore@v6
        with:
          path: work
          key: work-${{ github.run_id }}
          restore-keys: work-
      - name: Plan today
        id: plan
        shell: pwsh
        run: |
          git config user.name "joshiclip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $env:JOSHICLIP_SCHEDULE = "${{ github.event.schedule }}"
          $ch = python -c "import json; from joshiclip import config, daily; print(json.dumps(daily.my_channels(config.load()['daily'])))"
          "channels=$ch" >> $env:GITHUB_OUTPUT
          if ($ch -eq "[]") { Write-Host "no channel of this repo runs at this time; nothing to do"; exit 0 }
          if ("${{ inputs.dry_run }}" -eq "true") { python -m joshiclip daily plan --dry-run } else { python -m joshiclip daily plan }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $d = python -c "from joshiclip import daily, config; print(daily._today(config.load()['daily']).date().isoformat())"
          "date=$d" >> $env:GITHUB_OUTPUT
      - name: Save analysis cache
        if: ${{ always() && !vars.RUNNER }}
        uses: actions/cache/save@v6
        with:
          path: work
          key: work-${{ github.run_id }}
      - name: Upload plan
        if: ${{ !inputs.dry_run && steps.plan.outputs.channels != '[]' }}
        uses: actions/upload-artifact@v7
        with:
          name: plan
          path: state/plans/${{ steps.plan.outputs.date }}.json
      - name: Keepalive (GitHub disables schedules after 60 days without a commit)
        if: always()
        shell: pwsh
        run: |
          git pull --rebase --autostash
          $last = [int](git log -1 --format=%ct)
          $days = ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $last) / 86400
          if ($days -gt 20) {
            git config user.name "joshiclip-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: no commit for $([int]$days) days"
            git push
          }
          exit 0

  post:
    needs: plan
    if: ${{ !inputs.dry_run && needs.plan.outputs.channels != '[]' }}
    runs-on: ${{ vars.RUNNER || 'windows-latest' }}
    timeout-minutes: 90                 # 6 clips recorded within a 45 min budget + renders
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      JOSHICLIP_YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.channels) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}          # latest commit: includes the plan + everything posted so far
          clean: ${{ !vars.RUNNER }}
      - uses: ./.github/actions/setup
        with:
          cookies: ${{ secrets.YTDLP_COOKIES }}
      - name: Restore analysis cache (same as the plan used)
        if: ${{ !vars.RUNNER }}
        uses: actions/cache/restore@v6
        with:
          path: work
          key: work-${{ github.run_id }}
      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: plan
      - name: Render + upload
        shell: pwsh
        env:
          # only these named secrets; each repo has just its own channel's set, the other is empty
          YT_A_CLIENT_ID: ${{ secrets.YT_A_CLIENT_ID }}
          YT_A_CLIENT_SECRET: ${{ secrets.YT_A_CLIENT_SECRET }}
          YT_A_REFRESH_TOKEN: ${{ secrets.YT_A_REFRESH_TOKEN || secrets.YT_REFRESH_TOKEN }}   # either name works
          YT_B_CLIENT_ID: ${{ secrets.YT_B_CLIENT_ID }}
          YT_B_CLIENT_SECRET: ${{ secrets.YT_B_CLIENT_SECRET }}
          YT_B_REFRESH_TOKEN: ${{ secrets.YT_B_REFRESH_TOKEN }}
        run: |
          git config user.name "joshiclip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m joshiclip check-auth --channel ${{ matrix.channel }}
          if ($LASTEXITCODE -ne 0) { Write-Error "YouTube login broken - fix it before rendering (docs/DAILY_SETUP.md)"; exit 1 }
          python -m joshiclip daily post --channel ${{ matrix.channel }} --plan plan/${{ needs.plan.outputs.date }}.json
      - name: Push what was posted (backstop)
        if: always()
        shell: pwsh
        run: |
          git add state
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "${{ matrix.channel }}: state after run ${{ github.run_id }}"
            for ($i = 0; $i -lt 5; $i++) { git pull --rebase --autostash; git push; if ($LASTEXITCODE -eq 0) { break } }
          }
          exit 0
      - name: Keep the reports (not the videos)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.channel }}
          path: |
            out/daily/**/report.md
            out/daily/**/upload.md
          if-no-files-found: ignore
