# JoshiClip configuration. Every weight, threshold, lexicon path and preset lives here.
# Changing a section invalidates only the cached stages that depend on it.

paths:
  work: work            # work/<video_id>/<stage>.json|.npy
  out: out              # out/<video_id>/short_NN.mp4 + report
  downloads: data/downloads
  models: models
  lexicon: config/lexicon.yaml
  style_ref: reference/style_ref_02_user.png
  style_ref_metrics: research/style_ref_metrics.json
  research: research

tools:
  ffmpeg: null          # absolute path override; null = auto-resolve (shutil.which -> registry PATH -> known dirs)
  fpcalc: null

channel:
  # Sourav Joshi Vlogs. UC<rest> -> UULF<rest> (long videos), UUSH<rest> (Shorts).
  official_id: UCjvgGbPPn-FgYeguc5nxG4A
  fan_ids: [UCxaaicd0KNuc41-c0e5R2Cg]   # @SouravAvantikaFun

download:
  update_first: true                     # yt-dlp -U before every download session
  sleep_interval: 3
  max_sleep_interval: 8
  format: "bv*[height<=2160]+ba/b"
  merge_format: mkv

normalize:
  allowed_fps: [30, 60]                  # source nominal fps is snapped to the nearest of these
  max_height: 2160                       # keep 4K when the source has it (final renders can be 2160x3840)
  video_codec: libx264
  crf: 15
  preset: superfast                      # x264 preset for the one-time CFR normalization (4K veryfast took 2.6 h)
  x264_threads: 0                        # 0 = auto; fixed value keeps the bitstream reproducible
  hwaccel_decode: none                   # none | qsv  (decode only; QSV VP9/H.264 decoding is bit-exact)
  audio_codec: flac                      # lossless + no encoder priming delay -> sample-exact cuts
  audio_rate: 48000
  proxy_height: 360
  proxy_max_fps: 30                      # proxy fps = norm fps if <= this, else norm fps / 2
  proxy_crf: 28

sync:
  max_av_offset_ms: 40
  probe_len_s: 1.5

asr:
  engine: faster-whisper
  model: large-v3                        # chosen by research/ASR_BENCHMARK.md (accuracy > speed; runs once, cached)
  candidates: [large-v3-turbo, large-v3]
  model_paths:                           # local CTranslate2 dirs (else HF cache / download)
    large-v3: "../sourav's jyoshi/models/faster-whisper-large-v3"
  compute_type: int8
  cpu_threads: 8
  language: hi
  beam_size: 5
  temperature: 0.0
  vad_filter: true
  condition_on_previous_text: false
  bench_excerpt_s: [300, 420]            # excerpt used by `joshiclip bench-asr`

align:
  engine: mms_fa                         # torchaudio MMS forced aligner on romanized words | none
  max_shift_s: 0.25                      # refined word edges may move at most this far from Whisper's
  vad_threshold: 0.5

sentences:
  end_punct: ["।", "?", "!", ".", "|"]
  segment_split_pause_s: 0.2            # Whisper segment end + >=0.2 s gap also ends a sentence (hi output has ~no punctuation)
  split_pause_s: 0.6                     # also split at word gaps >= this
  max_len_s: 12.0                        # split long run-ons at the largest internal gap
  min_len_s: 0.6

diarization:
  engine: mfcc_agglomerative             # lightweight, deterministic
  distance_threshold: 6.0
  max_speakers: 6
  min_sentence_s: 0.8

features:
  frame_hop_s: 0.01
  pitch_fmin: 70
  pitch_fmax: 500
  vision_fps: 2                          # faces / motion / colour histograms on the proxy
  face_detector: yunet                   # yunet (finds small/side faces in wide vlog shots: 66% vs 42% of frames) | mediapipe
  face_min_confidence: 0.6
  yamnet_classes:
    laugh: [Laughter, Giggle, Chuckle, chortle, Belly laugh, Baby laughter, Snicker]
    cheer: [Cheering, Applause, Crowd, Children shouting]
    scream: [Screaming, Shout, Yell, Bellow, Whoop, Battle cry]
    music: [Music]
    gasp: [Gasp]
    cry: [Crying, sobbing, Baby cry, infant cry, Whimper]
    dog: [Dog, Bark, Yip, Howl, Growling]
  scene_threshold: 27.0                  # PySceneDetect ContentDetector

topics:
  block_sentences: 4                     # TextTiling block size (sentences)
  boundary_min_depth: 0.12
  location_hist_window_s: 5
  location_hist_threshold: 0.7           # Bhattacharyya distance; handheld footage: median 0.25, p90 0.48, p99 0.70
  ambience_threshold: 0.35
  weights: {text: 0.5, location: 0.3, ambience: 0.2}
  boundary_threshold: 0.55
  pause_bonus: 0.15                      # added for pauses of 1-4 s before a sentence
  min_gap_s: 10                          # at most one boundary per 10 s (strongest wins)

peaks:
  min_separation_s: 8
  min_z: 1.5
  weights: {laugh: 1.0, scream: 0.9, cheer: 0.6, energy: 0.5, gasp: 0.6, reveal: 0.6, comments: 1.2}

candidates:
  len_pref_s: [40, 50]
  len_allow_s: [35, 55]
  max_ends_per_start: 2

filters:
  intro_window_s: 5                      # intro/outro phrases are checked in the first N seconds of a clip
  edge_zone_s: 30                        # candidates in the first/last 30 s of the video ...
  edge_keep_top_pct: 5                   # ... survive only when in the top 5% by score
  min_pause_before_s: 0.6
  min_speech_frac: 0.5
  max_no_face_frac: 0.6
  location_change_zone: [0.1, 0.9]      # a location change inside this part of the clip rejects it
  location_change_score: 0.65            # colour shift (Bhattacharyya) ...
  location_ambience_shift: 0.35          # ... + scene cut within 2 s + ambience change = new location
  phrase_match_ratio: 85                 # rapidfuzz partial ratio on phonetic keys

scoring:
  hook_window_s: 3
  weights_final: {hook: 0.40, story: 0.45, viewer: 0.15}
  hook:
    first_word: 1.0
    first_sentence: 0.8
    energy_jump: 0.8
    pitch_jump: 0.5
    question: 0.7
    reveal: 0.8
    danger: 0.9
    conflict: 0.6
    funny: 1.0
    name_call: 0.5
    emotional: 0.5
    open_loop: 0.6
    lexicon: 0.5
  story:
    setup: 0.6
    arc: 1.0
    peak_position: 0.8
    payoff: 1.0
    one_scene: 0.5
    coherence: 0.6
    interaction: 0.7
    dead_air: 0.8          # penalty weight
    viewer: 0.0            # viewer signal lives in the final blend
    loop: 0.2
  peak_pos_range: [0.55, 0.85]
  payoff_after_peak_s: 8
  end_after_payoff_s: 4
  dead_air_gap_s: 1.5
  first_word_best_s: 0.4
  first_word_worst_s: 2.0
  round: 6

selection:
  seconds_per_short: 120
  min_shorts: 3
  max_shorts: 6
  min_score: 0.35
  max_overlap_frac: 0.10
  region_s: 120
  max_per_region: 2

layout:                                  # measured from reference/style_ref_02_user.png
  vertical: true
  canvas_draft: [720, 1280]
  canvas_final: [1080, 1920]
  header_frac: 0.085                     # white header with the title
  video_frac: 0.823                      # footage full-width below it; the rest is a white footer band
  title_font: C:/Windows/Fonts/segoeuib.ttf
  emoji_font: C:/Windows/Fonts/seguiemj.ttf
  title_size_frac: 0.030
  title_margin_frac: 0.04
  sticker: true                          # big emoji near the top of the footage, as in the reference
  sticker_size_frac: 0.17
  sticker_y_frac: 0.11
  captions: true
  caption_font: C:/Windows/Fonts/segoeuib.ttf
  caption_size_frac: 0.030               # ~4 % of height incl. outline
  caption_max_words: 3
  caption_y_frac: 0.50                   # vertical middle of the footage ...
  caption_y_alt_frac: 0.80               # ... or lower when a face is in the way
  caption_highlight: [255, 214, 10]

camera:
  zoom_min: 1.00
  zoom_max: 1.08
  zoom_sigma_s: 2.5
  omega: 2.2                             # spring stiffness (rad/s): slow, critically damped
  deadzone: 0.12                         # ignore face moves smaller than 12 % of the crop width

look:                                    # starting point; tune() matches the reference within +-10 %
  black: 2.0
  white: 98.0
  gamma: 1.0
  shoulder: 0.35
  lift: 0.02
  clahe: 1.8
  clahe_mix: 0.6
  vibrance: 1.25
  sharpen: 0.35
  glow: 0.12
  glow_thr: 0.75

look_tune:
  tonal_strength: 0.65                   # tonal stats move 65% toward the reference; colour + local contrast 100%

voice:
  denoise: true
  pitch_semitones: -1.0                  # slightly deeper voice (duration preserved); 0 = off
  formant: shifted                       # shifted = fuller/deeper timbre; preserved = same timbre
  low_shelf_hz: 150
  low_shelf_db: 3.0
  mud_cut_db: -2.5
  presence_db: 2.0
  comp_ratio: 2.5
  reverb_wet: 0.10
  reverb_decay_s: 0.5
  reverb_predelay_s: 0.02
  reverb_highcut_hz: 6000
  echo_taps: [[110, -20], [220, -28]]    # light slap echo (ms, dB)
  duck_db: -18
  bg_gap_db: -6
  duck_attack_ms: 50
  duck_release_ms: 300
  target_lufs: -14
  true_peak_db: -1.0

render:
  draft: {height: 720, preset: veryfast, crf: 23, audio_bitrate: 160k}
  final: {height: 1080, preset: slow, crf: 17, audio_bitrate: 256k}
  export_candidates: {height: 360, preset: veryfast, crf: 28, audio_bitrate: 96k}
  x264_threads: 8
  frame_workers: 4                       # frames graded in parallel (OpenCV releases the GIL); output order fixed
