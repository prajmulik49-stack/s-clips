# Sourav Joshi lexicon. source: seed (hand-written from the spec + v5 research).
# `joshiclip research` (build step 4) mines names / reactions / intro-outro phrases from his transcripts and
# rewrites the mined sections, keeping this file's structure. Phrases are Roman; matching is phonetic,
# so Devanagari Whisper output ("वेलकम टू माय व्लॉग") matches "welcome to my vlog".
source: seed

